- name: Install johnny-six config
  template:
    src: johnny-six.j2
    dest: /etc/default/johnny-six
    mode: 0600

- name: Import johnny-six service
  copy:
    src: johnny-six.service
    dest: /etc/systemd/system/johnny-six.service

- name: Reload services daemon
  command: systemctl daemon-reload

- name: Enable johnny-six service
  command: systemctl enable johnny-six

- name: (Re)start johnny-six service
  command: systemctl restart johnny-six

