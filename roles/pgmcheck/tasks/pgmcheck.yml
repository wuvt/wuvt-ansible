---
- name: Pull pgmcheck source from GitHub
  git:
    repo: https://github.com/wuvt/wuvt-pgmcheck.git
    update: yes
    force: yes
    dest: /opt/pgmcheck

- name: Install pgmcheck.service
  copy:
    src: pgmcheck.service
    dest: /etc/systemd/system/pgmcheck.service

- name: Install pgmcheck config
  template:
    src: pgmcheck.j2
    dest: /etc/default/pgmcheck
    mode: 0600

- name: Create pgmcheck data directories
  file:
    dest: "/var/pgmcheck/{{ item }}"
    owner: liquidsoap
    group: liquidsoap
    state: directory
  with_items:
  - current
  - staging

- name: Start and enable pgmcheck
  service:
    name: pgmcheck
    state: started
    enabled: yes
  tags:
  - services
